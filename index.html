<style>
:root {
  /* Claude 配色：暖米白纸面、陶土橙主色、墨色正文；苯环/分子线稿作为装饰母题。桌面左侧图标导航，手机顶部滚动导航 */
  --bg: #f5f3ec; --surface: #fffdf8; --surface2: #f8f5ee; --ink: #1f1e1b; --muted: #6f6b62; --line: #e4ded1;
  --accent: #c96442; --accent-2: #a9502f; --accent-soft: #f6e4da; --hot: #c96442; --hot-soft: #f6e4da; --bad: #b5402f; --bad-soft: #f9e2dc; --ok: #4f7a3f; --ok-soft: #e5efd9; --mid: #a87b16; --mid-soft: #f6ecd0;
  --c-blue: #e9eef3; --c-blue-b: #6e8aa3; --c-warn: #f8ecd6; --c-warn-b: #bf8a2e; --c-red: #f8e2dc; --c-red-b: #c0513f; --c-good: #e6efdc; --c-good-b: #5d8a49;
  --c-green: #e1efd9; --c-green-b: #4e9145; --c-olive: #eeedd6; --c-olive-b: #8a8a2c; --c-brown: #efe2d4; --c-brown-b: #8f5b2e; --c-purple: #ece4f1; --c-purple-b: #7e5d9f; --c-pink: #f6e2e8; --c-pink-b: #bb5b80;
  --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px -10px rgba(60,40,20,.18);
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --f-disp: "Noto Serif SC", "Songti SC", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1e1c; --surface: #2a2926; --surface2: #302e2b; --ink: #f1ede4; --muted: #a8a397; --line: #3d3a35;
  --accent: #d97757; --accent-2: #e8906f; --accent-soft: #432a20; --hot: #d97757; --hot-soft: #432a20; --bad: #e57d6b; --bad-soft: #43231d; --ok: #96c27f; --ok-soft: #26321f; --mid: #dcb757; --mid-soft: #3a3019;
  --c-blue: #26303a; --c-blue-b: #93afc8; --c-warn: #3a2f1d; --c-warn-b: #e0a650; --c-red: #3f2521; --c-red-b: #ec8676; --c-good: #263224; --c-good-b: #8fbe78;
  --c-green: #22331f; --c-green-b: #86c37a; --c-olive: #31311c; --c-olive-b: #c3c25e; --c-brown: #3a2b1f; --c-brown-b: #d39a68; --c-purple: #2f2737; --c-purple-b: #b79ad4; --c-pink: #3b252d; --c-pink-b: #e591b2;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f1e1c; --surface: #2a2926; --surface2: #302e2b; --ink: #f1ede4; --muted: #a8a397; --line: #3d3a35;
  --accent: #d97757; --accent-2: #e8906f; --accent-soft: #432a20; --hot: #d97757; --hot-soft: #432a20; --bad: #e57d6b; --bad-soft: #43231d; --ok: #96c27f; --ok-soft: #26321f; --mid: #dcb757; --mid-soft: #3a3019;
  --c-blue: #26303a; --c-blue-b: #93afc8; --c-warn: #3a2f1d; --c-warn-b: #e0a650; --c-red: #3f2521; --c-red-b: #ec8676; --c-good: #263224; --c-good-b: #8fbe78;
  --c-green: #22331f; --c-green-b: #86c37a; --c-olive: #31311c; --c-olive-b: #c3c25e; --c-brown: #3a2b1f; --c-brown-b: #d39a68; --c-purple: #2f2737; --c-purple-b: #b79ad4; --c-pink: #3b252d; --c-pink-b: #e591b2;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.7; }
a { color: var(--accent); }
/* --az：大屏自动放大系数（由脚本按窗口宽度计算），侧栏和内容一起等比放大 */
.shell { display: grid; grid-template-columns: calc(220px * var(--az, 1)) 1fr; min-height: 100%; }
nav.side { zoom: var(--az, 1); position: sticky; top: 0; height: calc(100vh / var(--az, 1)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { font-family: var(--f-disp); font-size: 19px; font-weight: 700; padding: 0 10px 2px; }
.brand small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 400; color: var(--muted); }
nav.side a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 15px; }
nav.side a span.k { width: 22px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.side .sep { height: 1px; background: var(--line); margin: 8px 6px; }
nav.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px 10px; }
main { padding: 26px clamp(24px, 3vw, 56px) 60px; width: 100%; min-width: 0; }
main > div { zoom: var(--zoom, 1); max-width: 1240px; margin: 0 auto; }
.form { display: grid; gap: 12px; }
.form .row > label, .form .row > .lab { min-width: 108px; font-weight: 500; flex-shrink: 0; }
.form input:not([type=date]) { min-width: 180px; }
.top { display: none; }
h1 { font-family: var(--f-disp); font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-family: var(--f-disp); font-size: 19px; margin: 22px 0 10px; text-wrap: balance; }
h3 { font-size: 16px; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card.flat { background: var(--surface2); }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile > span { font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sp { flex: 1; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 13px; cursor: pointer; line-height: 1.5; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.pri, :root:not([data-theme="light"]) .btn.pri { color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { font-size: 13px; padding: 3px 10px; }
.btn.r1 { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn.r2 { background: var(--mid-soft); color: var(--mid); border-color: var(--mid); }
.btn.r3 { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 0 9px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip.y { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip.hot { background: var(--hot-soft); color: var(--hot); border-color: transparent; font-weight: 600; }
.chip.src1 { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.src2 { background: var(--hot-soft); color: var(--hot); border-color: transparent; }
.chip.src3 { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.doubt { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.lv { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.lv i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--line); }
.lv.l1 i { background: var(--bad); } .lv.l2 i { background: var(--mid); } .lv.l3 i { background: var(--ok); }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; font: inherit; font-size: 13.5px; padding: 4px 11px; border-radius: 7px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
select, input[type=text], input[type=search], input[type=date], input[type=number] { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 9px; }
textarea { width: 100%; font: inherit; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 9px; padding: 9px 11px; min-height: 90px; resize: vertical; }
.q { display: flex; flex-direction: column; gap: 10px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qtext { font-size: 16.5px; font-weight: 600; white-space: pre-line; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
.opt:disabled { cursor: default; opacity: 1; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans { border-left: 3px solid var(--accent); background: var(--surface2); border-radius: 0 10px 10px 0; padding: 10px 14px; }
.ans p { margin: 3px 0 6px; } .ans ul, .ans ol, .kbody ul, .kbody ol { margin: 4px 0 8px; padding-left: 22px; } .ans li, .kbody li { margin: 2px 0; }
.ans .h { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0 10px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
table.t th { background: var(--surface); font-weight: 600; }
.tw { overflow-x: auto; }
.note { font-size: 13px; color: var(--muted); }
.warnbox { background: var(--hot-soft); color: var(--ink); border-radius: 9px; padding: 8px 12px; font-size: 13.5px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; display: flex; gap: 10px; align-items: flex-start; }
.li .main { flex: 1; min-width: 0; }
.li .t { font-weight: 500; }
.li .s { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.stripe { width: 4px; align-self: stretch; border-radius: 3px; background: var(--line); }
.stripe.hot { background: var(--hot); } .stripe.l1 { background: var(--bad); } .stripe.l2 { background: var(--mid); } .stripe.l3 { background: var(--ok); }
.bar { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.mod { cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
.mod .no { font-family: var(--f-disp); font-size: 13px; color: var(--muted); }
.mod .nm { font-weight: 700; font-size: 16px; }
.kitem { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.kitem > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.kitem > summary::-webkit-details-marker { display: none; }
.kitem > summary .id { font-family: var(--f-disp); color: var(--muted); font-size: 13px; min-width: 30px; }
.kitem > summary .t { font-weight: 600; flex: 1; }
.kitem[open] > summary { border-bottom: 1px solid var(--line); }
.kbody { padding: 12px 16px; } .kbody p { margin: 4px 0 8px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); cursor: pointer; font: inherit; text-align: left; color: var(--ink); }
.step b { display: block; font-size: 14px; } .step span { font-size: 12px; color: var(--muted); }
.step[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.step.done b::after { content: " ✓"; color: var(--ok); }
.heat { display: inline-flex; gap: 2px; vertical-align: middle; }
.heat i { width: 7px; height: 12px; border-radius: 2px; background: var(--line); display: inline-block; }
.heat i.on { background: var(--hot); }
svg.dg { width: 100%; height: auto; display: block; }
svg.dg .dgt { font-size: 14px; fill: var(--ink); font-family: var(--f-body); font-weight: 600; }
svg.dg .dgt.sm { font-size: 12.5px; font-weight: 400; fill: var(--muted); }
svg.dg .dgl { font-size: 11.5px; fill: var(--muted); font-family: var(--f-body); }
svg.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dgnav { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.dgc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dgi { background: var(--surface2); border-radius: 9px; padding: 8px 12px; min-height: 48px; margin: 8px 0 0; font-size: 14.5px; }
.dgr { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 6px; } .dgr input { flex: 1; }
.modal { position: fixed; inset: 0; background: rgba(10,15,20,.5); display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; z-index: 50; overflow-y: auto; }
.modal .card { width: 100%; max-width: 760px; }
.mhd { gap: 8px; flex-wrap: wrap; }
.mback { padding-left: 8px; }
.tree svg { width: 100%; height: auto; }
.tree .nodeT { cursor: pointer; }
mark { background: var(--mid-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.plan { counter-reset: p; display: grid; gap: 8px; }
.plan .pi { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; }
.plan .pi .min { font-family: var(--f-disp); font-size: 18px; color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 18px; text-align: center; }
.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  nav.side { display: none; }
  .top { display: block; position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top .bar1 { display: flex; align-items: center; padding: 8px 16px 0; gap: 8px; }
  .top .bar1 b { font-family: var(--f-disp); font-size: 17px; }
  .top nav { display: flex; overflow-x: auto; gap: 4px; padding: 6px 12px 8px; scrollbar-width: none; }
  .top nav a { flex: none; font-size: 14px; padding: 4px 11px; border-radius: 99px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); }
  .top nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .top nav a[aria-current="page"] .ico { color: #fff; }
  main { padding: 16px 16px 50px; }
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g2 { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; }
  h1 { font-size: 22px; }
  .plan .pi { grid-template-columns: 46px 1fr; } .plan .pi .btn { grid-column: 2; justify-self: start; }
}

/* ---- 设计补充 ---- */
.card { box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.ico { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; }
nav.side { background: var(--surface); }
nav.side a { gap: 11px; }
nav.side a .ico { color: var(--muted); }
nav.side a:hover { background: var(--surface2); }
nav.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-2); }
nav.side a[aria-current="page"] .ico { color: var(--accent); }
:root[data-theme="dark"] nav.side a[aria-current="page"], :root:not([data-theme="light"]) nav.side a[aria-current="page"] { color: var(--accent-2); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 4px; }
.brand .mk { width: 38px; height: 38px; flex: none; }
.brand .bt { line-height: 1.25; font-size: 16.5px; white-space: nowrap; }
.brand small { white-space: nowrap; font-size: 11.5px; }
.side .deco { margin: 14px 6px 0; color: var(--line); }
h1 { letter-spacing: .5px; }
.kick { font-size: 12.5px; letter-spacing: 2px; color: var(--accent); font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.kick::before { content: ""; width: 18px; height: 2px; background: var(--accent); border-radius: 2px; }
h2 { display: flex; align-items: center; gap: 9px; }

.hero { position: relative; overflow: hidden; background: linear-gradient(120deg, var(--accent-soft), var(--surface) 70%); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; box-shadow: var(--shadow); margin-bottom: 14px; }
.hero h1 { font-size: 27px; }

.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .rv b { font-family: var(--f-disp); font-size: 24px; line-height: 1.1; }
.ring .rv span { font-size: 11.5px; color: var(--muted); }
.tile { position: relative; overflow: hidden; }
.tile .ti { position: absolute; right: 12px; top: 12px; width: 26px; height: 26px; color: var(--accent); opacity: .55; }
.mod { transition: transform .15s, box-shadow .15s, border-color .15s; }
.mod:hover, .li[data-cl]:hover, .li[data-q]:hover, .li[data-it]:hover { border-color: var(--accent); }
.mod .mi { width: 34px; height: 34px; color: var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 6px; float: right; }
.mod[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 60%); }
.kitem > summary .mi { width: 22px; height: 22px; color: var(--accent); }
.seg button[aria-pressed="true"] { color: var(--accent-2); }
.btn.pri:hover { background: var(--accent-2); border-color: var(--accent-2); }
.plan .pi { padding: 8px 0; border-top: 1px dashed var(--line); }
.plan .pi:first-child { border-top: 0; }
.plan .pi .min { color: var(--accent); }
.empty-ill { display: block; margin: 0 auto 6px; width: 64px; height: 64px; color: var(--line); }
.top nav a { display: inline-flex; gap: 5px; align-items: center; }
.top nav a .ico { width: 16px; height: 16px; }
.top .bar1 .mk { width: 26px; height: 26px; }
@media (prefers-reduced-motion: no-preference) { .mod:hover { transform: translateY(-2px); } }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero .ring { justify-self: start; } .hero .mol { right: -40px; } }

/* ================= 书本风格（设置 → 外观 → 风格 → 书本） =================

   朱红丝带书签、页脚页码、换页时的翻页动效；深色模式是“夜读”配色。现代风格不受影响。 */

.pv-m b:nth-of-type(1) { top: 8px; background: linear-gradient(110deg, #f6e4da, #fffdf8 70%); } .pv-m b:nth-of-type(2) { top: 27px; } .pv-m b:nth-of-type(3) { top: 46px; }
.pv-b { background: radial-gradient(circle at 30% 20%, #7a5a43, #4a3426); }

.pv-b b { left: 50%; right: 10px; border-radius: 0 3px 3px 0; box-shadow: inset 8px 0 8px -6px rgba(60,40,20,.35), 2px 2px 0 -1px #f7f1e3, 3px 3px 0 -1px #c9bba0; }
.pv-b em { position: absolute; right: 22px; top: 6px; width: 6px; height: 24px; background: #a8432a; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }

:root[data-skin="book"] {
  --ribbon: #a8432a; --desk: #5d4433; --desk-2: #3f2d22; --paper: #f7f1e3; --rule: #e2d6bf; --slip: #f2e9d5; --ink-shadow: rgba(70,45,20,.22);

  color-scheme: light;
}
:root[data-skin="book"][data-theme="dark"] {
  --ribbon: #8e3a24; --desk: #1b1612; --desk-2: #0e0b09; --paper: #27221c; --rule: #3e362c; --slip: #2f2922; --ink-shadow: rgba(0,0,0,.5);
  --bg: #27221c; --surface: #2c2620; --surface2: #332c25; --ink: #eadfca; --muted: #a89a83; --line: #463d32;

}

  --ribbon: #8e3a24; --desk: #1b1612; --desk-2: #0e0b09; --paper: #27221c; --rule: #3e362c; --slip: #2f2922; --ink-shadow: rgba(0,0,0,.5);
  --bg: #27221c; --surface: #2c2620; --surface2: #332c25; --ink: #eadfca; --muted: #a89a83; --line: #463d32;
  --accent: #dc8b66; --accent-2: #eaa382; --accent-soft: #46291d; --hot: #dc8b66; --hot-soft: #46291d; color-scheme: dark; } }

/* 书桌与书 */
[data-skin="book"] body { background: var(--desk-noise), radial-gradient(ellipse at 35% 15%, var(--desk), var(--desk-2) 80%); background-attachment: fixed; font-size: 16px; line-height: 1.8; }
[data-skin="book"] .shell { --sw: calc(220px * var(--az, 1)); margin: 16px 22px 22px 16px; min-height: calc(100% - 38px); border-radius: 5px;
  /* 书脊：左右两页在中缝处向内变暗，中间一条细线，贯穿整本书的高度 */
  background: var(--noise), linear-gradient(90deg, rgba(0,0,0,.035), transparent 26px, transparent calc(var(--sw) - 36px), var(--ink-shadow) calc(var(--sw) - 1px), var(--rule) calc(var(--sw) - 1px), var(--rule) var(--sw), var(--ink-shadow) var(--sw), transparent calc(var(--sw) + 40px)), var(--paper);
  box-shadow: 2px 2px 0 -1px var(--paper), 3px 3px 0 -1px var(--rule), 4px 4px 0 -1px var(--paper), 5px 5px 0 -1px var(--rule), 6px 6px 0 -1px var(--paper), 7px 7px 0 -1px var(--rule), 0 18px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3); }
[data-skin="book"] nav.side { top: 16px; height: calc((100vh - 32px) / var(--az, 1)); background: transparent; border-right: 0; border-radius: 5px 0 0 5px; padding: 26px 18px 18px 18px; }
[data-skin="book"] main { position: relative; border-radius: 0 5px 5px 0; padding-top: 34px; padding-bottom: 40px; padding-right: clamp(40px, 4vw, 64px); }
/* 丝带书签 */
[data-skin="book"] .shell { position: relative; }
[data-skin="book"] .shell::after { content: ""; position: absolute; top: -6px; right: calc((clamp(40px, 4vw, 64px) - 20px) / 2); width: 20px; height: 108px; background: linear-gradient(90deg, rgba(0,0,0,.12), transparent 30%, transparent 70%, rgba(0,0,0,.14)), var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); pointer-events: none; z-index: 3; }
/* 页脚页码 */
[data-skin="book"] main > div::after { content: "— " attr(data-pg) " —"; display: block; text-align: center; margin-top: 46px; font-family: var(--f-disp); color: var(--muted); letter-spacing: 3px; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) {
  [data-skin="book"] main > div.turn { animation: bookUnder .75s ease-out; }
  @keyframes bookUnder { from { opacity: .45; } to { opacity: 1; } }
}

/* 目录（左页） */
[data-skin="book"] .brand { flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 0 4px 6px; }
[data-skin="book"] .brand .mk { width: 34px; height: 34px; }

[data-skin="book"] .brand small { letter-spacing: 1px; margin-top: 2px; }
[data-skin="book"] nav.side .sep { background: none; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); height: 4px; margin: 10px 4px 12px; }
[data-skin="book"] .toc { display: block; text-align: center; font-family: var(--f-disp); font-weight: 700; letter-spacing: 6px; color: var(--muted); font-size: 13.5px; margin: 0 0 8px; }
[data-skin="book"] nav.side a { position: relative; border-radius: 0; padding: 6px 4px 6px 6px; gap: 9px; font-family: var(--f-disp); font-weight: 600; font-size: 15px; }

[data-skin="book"] nav.side a[aria-current="page"] .pn, [data-skin="book"] nav.side a[aria-current="page"] .ld { color: var(--accent); border-color: var(--accent); opacity: 1; }
[data-skin="book"] .side .deco { color: var(--rule); }

/* 排版 */
[data-skin="book"] h1 { font-size: 30px; letter-spacing: 2px; }
[data-skin="book"] h1::after { content: ""; display: block; width: 54px; height: 4px; border-top: 1.5px solid var(--accent); border-bottom: 1px solid var(--accent); margin-top: 8px; opacity: .8; }

[data-skin="book"] h2::after { content: ""; flex: 1; height: 0; border-top: 1px solid var(--rule); margin-left: 6px; }
[data-skin="book"] .kick { font-family: var(--f-disp); letter-spacing: 4px; font-size: 12.5px; }
[data-skin="book"] .lead { font-size: 15px; line-height: 1.85; }
[data-skin="book"] .note { line-height: 1.6; }
[data-skin="book"] .qtext { font-size: 17px; line-height: 1.75; }

/* 卡片与控件：像印在纸上 */
[data-skin="book"] .card, [data-skin="book"] .li, [data-skin="book"] .kitem, [data-skin="book"] .step { border-radius: 4px; border-color: var(--rule); box-shadow: none; background: color-mix(in srgb, var(--surface) 70%, transparent); }
[data-skin="book"] .card.flat { background: color-mix(in srgb, var(--surface2) 70%, transparent); }
[data-skin="book"] .hero { border-radius: 4px; border-color: var(--rule); background: color-mix(in srgb, var(--surface) 55%, transparent); box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 6px var(--rule); padding: 26px 28px; }
[data-skin="book"] .hero h1 { font-size: 30px; }
[data-skin="book"] .hero .mol { opacity: .1; }
[data-skin="book"] .tile { border-top: 3px double var(--rule); }
[data-skin="book"] .tile b { font-family: var(--f-disp); }
[data-skin="book"] .btn { border-radius: 4px; border-color: var(--line); background: transparent; font-family: var(--f-body); letter-spacing: .5px; }
[data-skin="book"] .btn:hover { border-color: var(--accent); color: var(--accent); }
[data-skin="book"] .btn.pri { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(80,30,10,.25); }
[data-skin="book"] .btn.pri:hover { color: #fff; }
:root[data-skin="book"][data-theme="dark"] .btn.pri, :root[data-skin="book"][data-theme="dark"] .btn.pri:hover { color: #1e140e; }
@media (prefers-color-scheme: dark) { :root[data-skin="book"]:not([data-theme="light"]) .btn.pri, :root[data-skin="book"]:not([data-theme="light"]) .btn.pri:hover { color: #1e140e; } }
[data-skin="book"] .btn.r1 { background: var(--bad-soft); } [data-skin="book"] .btn.r2 { background: var(--mid-soft); } [data-skin="book"] .btn.r3 { background: var(--ok-soft); }
[data-skin="book"] .chip { border-radius: 3px; background: transparent; border-color: var(--rule); }
[data-skin="book"] .chip.hot { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
[data-skin="book"] .chip.src1, [data-skin="book"] .chip.src2, [data-skin="book"] .chip.src3, [data-skin="book"] .chip.doubt { border-color: currentColor; }
[data-skin="book"] .seg { border-radius: 4px; background: transparent; border-color: var(--rule); }
[data-skin="book"] .seg button { border-radius: 3px; }
[data-skin="book"] .seg button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: none; }
[data-skin="book"] .skins button { background: transparent; border-radius: 5px; border-color: var(--rule); }
[data-skin="book"] select, [data-skin="book"] input[type=text], [data-skin="book"] input[type=search], [data-skin="book"] input[type=date], [data-skin="book"] input[type=number] { border-radius: 4px; background: transparent; border-color: var(--line); }
[data-skin="book"] .opt { border-radius: 4px; background: transparent; border-color: var(--rule); }
[data-skin="book"] .opt.sel { background: var(--accent-soft); } [data-skin="book"] .opt.right { background: var(--ok-soft); } [data-skin="book"] .opt.wrong { background: var(--bad-soft); }
/* 作答区：横线稿纸 */
[data-skin="book"] textarea { border-radius: 3px; border-color: var(--rule); line-height: 30px; font-size: 15.5px; padding: 0 12px; min-height: 92px;
  background: repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px) local, color-mix(in srgb, var(--surface) 60%, transparent); }
/* 参考答案：夹在书里的答案纸条 */

[data-skin="book"] .bar { border-radius: 1px; height: 6px; background: var(--rule); }
[data-skin="book"] .stripe { border-radius: 1px; }
[data-skin="book"] .warnbox { border-radius: 3px; border: 1px dashed var(--accent); background: transparent; }
[data-skin="book"] .sticky { background: var(--noise), var(--paper); }
[data-skin="book"] table.t th { background: transparent; border-bottom: 1.5px solid var(--ink); }

[data-skin="book"] .modal .card { background: var(--noise), var(--paper); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
[data-skin="book"] .mod .mi { border-radius: 50%; }
[data-skin="book"] .dgi { border-radius: 3px; }

/* 手机/平板竖屏：书本铺满屏幕，保留纸张、丝带和页码 */

  [data-skin="book"] main { box-shadow: none; border-radius: 0; padding-top: 22px; }
  [data-skin="book"] .shell::after { height: 64px; width: 14px; right: 6px; top: 0; }
  [data-skin="book"] main { padding-right: 26px; }
  [data-skin="book"] .top { background: var(--noise), var(--paper); border-bottom: 3px double var(--rule); }
  [data-skin="book"] .top nav a { border-radius: 3px; font-family: var(--f-disp); }
  [data-skin="book"] .top nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); }

/* 书本风格（桌面/平板横屏）：书固定在书桌中央，四周的页边、书脊始终可见，只有右页内部滚动 */
@media (min-width: 861px) {
  [data-skin="book"] body { overflow: hidden; }
  [data-skin="book"] .shell { height: calc(100vh - 38px); height: calc(100dvh - 38px); min-height: 0; }
  [data-skin="book"] nav.side { position: relative; top: 0; height: calc((100vh - 38px) / var(--az, 1)); height: calc((100dvh - 38px) / var(--az, 1)); overflow-y: auto; scrollbar-width: none; }
  [data-skin="book"] nav.side::-webkit-scrollbar { display: none; }
  [data-skin="book"] main { padding-top: 0; height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  [data-skin="book"] main > div { padding-top: 34px; }
  [data-skin="book"] .sticky { background: var(--noise), var(--paper); }
  [data-skin="book"] main::-webkit-scrollbar { width: 8px; } [data-skin="book"] main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
}
/* 翻页：旧的一页绕书脊翻起离开（往后翻），或绕外侧翻回（往前翻），新的一页在下面露出来 */
.flip { position: fixed; z-index: 2; overflow: hidden; pointer-events: none; background: var(--noise), var(--paper); transform-origin: left center; will-change: transform;
  animation: flipFwd .72s cubic-bezier(.5,.05,.6,.9) forwards; box-shadow: 0 0 24px rgba(0,0,0,.18); }
.flip.under { z-index: 1; animation: none; box-shadow: none; }
.flip.under::after { animation: underShade .7s ease-in-out forwards; background: linear-gradient(270deg, rgba(40,25,10,.05), rgba(40,25,10,.3)); }
main.swing { z-index: 2; background: var(--noise), linear-gradient(90deg, var(--ink-shadow), transparent 40px), var(--paper); animation: swingIn .72s cubic-bezier(.22,.7,.3,1); box-shadow: 0 0 26px rgba(0,0,0,.2); }
main.swing::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: swingShade .72s ease-out forwards;
  background: linear-gradient(90deg, rgba(40,25,10,.36), rgba(40,25,10,.08) 40%, rgba(255,250,240,.1) 75%, rgba(40,25,10,.2)); }
.flip > main { position: absolute; left: 0; height: auto !important; overflow: visible !important; }
.flip > main > div::after { content: none; }
.flip::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: flipShade .72s ease-in forwards;
  background: linear-gradient(90deg, rgba(40,25,10,.38), rgba(40,25,10,.08) 35%, rgba(255,250,240,.12) 75%, rgba(40,25,10,.22)); }
@keyframes flipFwd { from { transform: perspective(2800px) rotateY(0deg); } to { transform: perspective(2800px) rotateY(-90deg); } }
@keyframes swingIn { from { transform: perspective(2800px) rotateY(-90deg); } to { transform: perspective(2800px) rotateY(0deg); } }
@keyframes swingShade { from { opacity: 1; } to { opacity: 0; } }
@keyframes underShade { from { opacity: 0; } to { opacity: 1; } }
@keyframes flipShade { from { opacity: 0; } to { opacity: 1; } }

/* 更新提示弹窗与更新日志 */
.modal.upd { align-items: center; }
.modal.upd .card { max-width: 540px; padding: 22px 24px; }
.upd .uh { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.upd .uh .mk { width: 42px; height: 42px; flex: none; }

details.chlog[open] summary::before { transform: rotate(90deg); }

@media (prefers-reduced-motion: no-preference) { .modal.upd .card { animation: updIn .35s cubic-bezier(.2,.8,.3,1); } @keyframes updIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } } }

.app-upd { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; width: min(560px, calc(100% - 24px));
  display: flex; gap: 10px; align-items: center; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.2); }

/* 下载 App */
.dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.dl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r, 14px); padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.dl-card.hl { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dl-h { display: flex; gap: 12px; align-items: center; }

.dl-i { width: 40px; height: 40px; padding: 8px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); flex: none; }
.dl-steps { margin: 0; padding-left: 20px; display: grid; gap: 7px; line-height: 1.65; }
.dl-steps li::marker { color: var(--accent); font-weight: 700; }
.dl-steps a { color: var(--accent); word-break: break-all; }
.dl-card .row { gap: 8px; flex-wrap: wrap; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.foot .dl-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.foot .dl-link .ico { width: 16px; height: 16px; }
.foot { display: grid; }
[data-skin="book"] .dl-card { background: color-mix(in srgb, var(--surface) 70%, transparent); border-color: var(--rule); border-radius: 4px; }
[data-skin="book"] .dl-i { border-radius: 50%; }

/* 今日计划：复习路径进度与“今日已完成” */
.psteps { display: flex; gap: 4px; margin-top: 6px; }
.psteps i { width: 26px; height: 5px; border-radius: 3px; background: var(--line); }
.psteps i.on { background: var(--accent); }
.pdone { display: grid; gap: 6px; justify-items: end; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 600; white-space: nowrap; }

/* 背诵模式 */
.recite { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface2); }
.recite .rhd { margin-bottom: 8px; gap: 10px; }
.seg.sm button { padding: 4px 10px; font-size: 13px; }
.rbody { display: grid; gap: 8px; }
.rh { font-weight: 700; color: var(--accent-2); margin-top: 6px; font-size: 14px; }
.rp { display: block; text-align: left; width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; line-height: 1.75; }
.rp.rk { cursor: pointer; }
.rp.rk:hover { border-color: var(--accent); }
.rp .rn { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 11px; background: var(--accent-soft); color: var(--accent-2); font-size: 12px; font-weight: 700; margin-right: 8px; vertical-align: 1px; }
.rp .rt1 { font-weight: 600; }
.rp .rtap { float: right; color: var(--muted); font-size: 12px; margin-top: 2px; }
.rp .rc1 { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.rp.open { border-color: var(--accent-soft); }
.fc { cursor: pointer; border-radius: 4px; }
.fc .fcb { color: var(--accent); letter-spacing: -1px; }
.fc:hover { background: var(--accent-soft); }
.fc.open { background: transparent; }
/* 按要点自评 */
.ptc { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 12px; padding: 10px 12px; }
.ptc .ph { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 12px 4px 5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.pchip .rn { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--surface2); font-size: 11.5px; font-weight: 700; }
.pchip[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pchip[aria-pressed="true"] .rn { background: var(--ok); color: #fff; }
.miss { margin: 6px 0 2px; font-size: 13px; color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 5px 10px; }
[data-skin="book"] .recite, [data-skin="book"] .rp, [data-skin="book"] .pchip, [data-skin="book"] .ptc { border-radius: 4px; }
[data-skin="book"] .recite { background: var(--slip); border-color: var(--rule); }
[data-skin="book"] .rp { background: transparent; border-color: var(--rule); }

/* 进度页图表 */
.radar-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); gap: 18px; align-items: center; }
@media (max-width: 760px) { .radar-wrap { grid-template-columns: 1fr; } }
.chart .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.chart .legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; }
.sw-a { background: var(--accent-soft); border: 1.5px dashed var(--accent); opacity: .8; }
.sw-m { background: var(--accent); }
svg.radar { width: 100%; max-width: 460px; display: block; margin: 0 auto; }
svg.radar .rl { font-size: 12.5px; fill: var(--ink); }
svg.radar .rg { font-size: 10.5px; fill: var(--muted); }
svg.trend { width: 100%; }
svg .dgv { font-size: 13px; font-weight: 700; fill: var(--ink); }
.weak { display: grid; gap: 8px; }
.wm { font: inherit; text-align: left; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; display: grid; gap: 1px; color: var(--ink); }
.wm:hover { border-color: var(--accent); }
.wm small { color: var(--muted); } .wm .go { color: var(--accent); font-size: 12.5px; }
details.tbl { margin-top: 6px; font-size: 13px; } details.tbl summary { cursor: pointer; color: var(--muted); }
.ctip { position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; display: grid; gap: 2px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 260px; }
.ctip[hidden] { display: none; }
[data-skin="book"] .wm { border-radius: 4px; background: transparent; border-color: var(--rule); }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

/* 试验性功能 */
nav.side a .nm { white-space: nowrap; }
/* 书本目录：beta 角标像上标一样挂在名字右上角，不挤占虚线和页码的位置，页码保持对齐 */
[data-skin="book"] nav.side a .nm { position: relative; flex: none; }
[data-skin="book"] nav.side a sup.beta { position: absolute; left: calc(100% - 12px); top: -9px; margin: 0; padding: 1px 4px 2px; font-size: 9px; box-shadow: 0 0 0 1.5px var(--paper); }
[data-skin="book"] nav.side a.has-beta .ld { margin-left: 14px; min-width: 4px; }
[data-skin="book"] nav.side a { padding-right: 30px; }
[data-skin="book"] nav.side a .pn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 22px; min-width: 22px; }
[data-skin="book"] nav.side a .ld { min-width: 0; }
sup.beta { font-size: 9.5px; font-weight: 700; letter-spacing: .3px; text-transform: lowercase; color: #fff; background: var(--accent); border-radius: 6px; padding: 1px 5px 2px; margin-left: 5px; vertical-align: 5px; line-height: 1; font-family: var(--f-body, inherit); }
sup.beta.lg { font-size: 12px; vertical-align: 12px; padding: 2px 7px 3px; }
nav.side a[aria-current="page"] sup.beta { background: var(--accent-2); }
.top nav a[aria-current="page"] sup.beta { background: #fff; color: var(--accent); }
.labs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 8px; }
.lab { display: grid; gap: 8px; align-content: start; transition: border-color .2s, box-shadow .2s; }
.lab.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lab-h { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.lab-h b { display: block; font-size: 17px; margin-bottom: 2px; }
.lab p { margin: 0; line-height: 1.7; }
.lab-st { margin-top: 2px; }
.lab.on .lab-st { color: var(--accent); font-weight: 600; }
.switch { flex: none; width: 50px; height: 30px; border-radius: 15px; border: 0; background: var(--line); position: relative; cursor: pointer; transition: background .2s; padding: 0; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-skin="book"] .card.lab { border-radius: 4px; }
[data-skin="book"] sup.beta { border-radius: 2px; }

/* 账号与同步 */
.acct .av { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.acct .row { gap: 10px; }
input[type=email], input[type=password] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
[data-skin="book"] input[type=email], [data-skin="book"] input[type=password] { border-radius: 4px; background: transparent; }

/* ================= 2.0 · Material 3（安卓） =================

  --bg: #FFF8F6; --surface: #FCEAE5; --surface2: #F7E4DF; --ink: #231917; --muted: #53433F; --line: #D8C2BC; --outline: #85736E;

  --accent: #FFB59D; --accent-2: #FFDBD0; --accent-soft: #73341E; --on-accent-soft: #FFDBD0; --sec: #5D4037; --on-sec: #FFDBD0;

[data-skin="md3"] body { font-size: 15.5px; letter-spacing: .1px; }
[data-skin="md3"] h1 { font-size: 30px; font-weight: 500; letter-spacing: 0; }
[data-skin="md3"] h2 { font-size: 20px; font-weight: 500; }
[data-skin="md3"] h2::before { width: 8px; height: 8px; border: 0; border-radius: 3px; background: var(--accent); transform: none; }

[data-skin="md3"] .lead { font-size: 15px; }

[data-skin="md3"] .tile b { font-weight: 500; font-size: 26px; }
/* 按钮：药丸形，按下时圆角收紧（形状变形）并带弹性 */
[data-skin="md3"] .btn { border: 0; border-radius: 20px; padding: 8px 20px; font-weight: 500; font-size: 14px; letter-spacing: .1px; background: var(--sec); color: var(--on-sec); transition: border-radius .35s var(--spring), transform .35s var(--spring), background-color .2s; }
[data-skin="md3"] .btn:hover { box-shadow: 0 1px 2px rgba(0,0,0,.15); filter: brightness(.97); }
[data-skin="md3"] .btn:active { border-radius: 10px; transform: scale(.97); }
[data-skin="md3"] .btn.pri { background: var(--accent); color: var(--bg); }
[data-skin="md3"] .btn.ghost { background: transparent; color: var(--accent); }
[data-skin="md3"] .btn.ghost:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: none; }
[data-skin="md3"] .btn.sm { padding: 5px 14px; font-size: 13px; border-radius: 16px; }
[data-skin="md3"] .btn.r1 { background: var(--bad-soft); color: var(--bad); } [data-skin="md3"] .btn.r2 { background: var(--mid-soft); color: var(--mid); } [data-skin="md3"] .btn.r3 { background: var(--ok-soft); color: var(--ok); }
[data-skin="md3"] .btn[aria-pressed="true"] { outline: 0 !important; box-shadow: inset 0 0 0 2px currentColor; border-radius: 12px; }
[data-skin="md3"] .chip { border-radius: 8px; border-color: var(--line); background: transparent; padding: 1px 10px; }
[data-skin="md3"] .chip.hot { background: var(--hot-soft); color: var(--hot); }
/* 分段按钮：描边药丸，选中项填充并带勾 */
[data-skin="md3"] .seg { background: transparent; border: 1px solid var(--outline); border-radius: 20px; padding: 0; gap: 0; overflow: hidden; }
[data-skin="md3"] .seg button { border-radius: 0; padding: 6px 14px; color: var(--ink); font-weight: 500; border-left: 1px solid var(--outline); }
[data-skin="md3"] .seg button:first-child { border-left: 0; }
[data-skin="md3"] .seg button[aria-pressed="true"] { background: var(--sec); color: var(--on-sec); box-shadow: none; font-weight: 500; }
[data-skin="md3"] .seg button[aria-pressed="true"]::before { content: "✓ "; }
/* 输入框与选项 */
[data-skin="md3"] select, [data-skin="md3"] input[type=text], [data-skin="md3"] input[type=search], [data-skin="md3"] input[type=date], [data-skin="md3"] input[type=number], [data-skin="md3"] input[type=email], [data-skin="md3"] input[type=password], [data-skin="md3"] input[type=time] { border: 1px solid var(--outline); border-radius: 8px; background: transparent; padding: 8px 12px; }
[data-skin="md3"] textarea { border: 0; border-bottom: 1px solid var(--outline); border-radius: 12px 12px 0 0; background: var(--surface2); }
[data-skin="md3"] textarea:focus { outline: 0; border-bottom: 2px solid var(--accent); }
[data-skin="md3"] .opt { border-radius: 14px; border-color: var(--line); background: transparent; padding: 10px 14px; }
[data-skin="md3"] .opt.sel { background: var(--accent-soft); color: var(--on-accent-soft); border-color: transparent; }
[data-skin="md3"] .ans { border-left: 0; border-radius: 16px; background: var(--surface2); }
[data-skin="md3"] .ans .h::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--accent); display: inline-block; }
[data-skin="md3"] .bar { height: 6px; border-radius: 3px; gap: 3px; background: transparent; }
[data-skin="md3"] .bar i { border-radius: 3px; }
[data-skin="md3"] .bar::after { content: ""; flex: 1; border-radius: 3px; background: var(--line); }
[data-skin="md3"] .step[aria-pressed="true"] { background: var(--accent-soft); color: var(--on-accent-soft); }
[data-skin="md3"] .modal { background: rgba(0,0,0,.32); }
[data-skin="md3"] .modal .card { border-radius: 28px; background: var(--surface2); }
/* 开关：Material 3 样式，开启时滑块变大并带勾 */
[data-skin="md3"] .switch { width: 52px; height: 32px; border-radius: 16px; background: var(--surface2); box-shadow: inset 0 0 0 2px var(--outline); }
[data-skin="md3"] .switch i { width: 16px; height: 16px; top: 8px; left: 8px; background: var(--outline); box-shadow: none; transition: all .3s var(--spring); }
[data-skin="md3"] .switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
[data-skin="md3"] .switch[aria-checked="true"] i { width: 24px; height: 24px; top: 4px; left: 4px; transform: translateX(20px); background: var(--bg); }
[data-skin="md3"] .switch[aria-checked="true"] i::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--accent); }
/* 导航抽屉（宽屏） */
[data-skin="md3"] nav.side { background: var(--bg); border-right: 0; padding: 16px 12px; }
[data-skin="md3"] nav.side .sep { background: var(--line); margin: 8px 16px; }
[data-skin="md3"] nav.side a { border-radius: 28px; padding: 0 16px; min-height: 52px; font-weight: 500; font-size: 14.5px; color: var(--muted); transition: background-color .2s; }
[data-skin="md3"] nav.side a:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
[data-skin="md3"] nav.side a[aria-current="page"] { background: var(--sec); color: var(--on-sec) !important; font-weight: 700; }
[data-skin="md3"] nav.side a[aria-current="page"] .ico { color: var(--on-sec); }
[data-skin="md3"] .brand .mk { border-radius: 14px; }
[data-skin="md3"] sup.beta { background: var(--hot-soft); color: var(--hot); border-radius: 8px; }
/* 底部动作面板 */
.sheet-wrap { align-items: flex-end !important; padding: 0 !important; }
.sheet { width: 100%; max-width: 640px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: shUp .32s cubic-bezier(.2,0,0,1); }
.sheet .grab { width: 32px; height: 4px; border-radius: 2px; background: var(--muted); opacity: .4; margin: 6px auto 10px; }
.sheet .sh-t { font-weight: 600; margin: 0 4px 10px; color: var(--muted); font-size: 14px; }
.sh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sh-grid a { display: grid; justify-items: center; gap: 6px; padding: 12px 4px; border-radius: 18px; text-decoration: none; color: var(--ink); font-size: 13px; text-align: center; background: var(--surface2); }
.sh-grid a[aria-current="page"] { background: var(--accent-soft); color: var(--on-accent-soft, var(--accent)); font-weight: 600; }
.sh-grid .bi .ico { width: 24px; height: 24px; }
body:has(.sheet-wrap) .bnav { visibility: hidden; }
@keyframes shUp { from { transform: translateY(100%); } to { transform: none; } }
[data-skin="md3"] .sheet { border-radius: 28px 28px 0 0; background: var(--surface); }
/* 窄屏：顶部应用栏 + 底部导航栏 */
@media (max-width: 860px) {
  [data-skin="md3"] .top, [data-skin="glass"] .top { border-bottom: 0; }
  [data-skin="md3"] .top nav, [data-skin="glass"] .top nav { display: none; }
  [data-skin="md3"] .top .bar1, [data-skin="glass"] .top .bar1 { padding: 12px 16px; }
  [data-skin="md3"] main, [data-skin="glass"] main { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  [data-skin="md3"] .bnav, [data-skin="glass"] .bnav { display: flex; position: fixed; z-index: 40; }
  [data-skin="md3"] .top { background: var(--bg); }
  [data-skin="md3"] .bnav { left: 0; right: 0; bottom: 0; height: calc(80px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); justify-content: space-around; align-items: center; }
  [data-skin="md3"] .bnav a, [data-skin="md3"] .bnav button { flex: 1; display: grid; justify-items: center; gap: 4px; text-decoration: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; }
  [data-skin="md3"] .bnav .bi { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .25s, width .35s var(--spring); }
  [data-skin="md3"] .bnav [aria-current="page"] { color: var(--ink); font-weight: 700; }
  [data-skin="md3"] .bnav [aria-current="page"] .bi { background: var(--sec); color: var(--on-sec); }
  [data-skin="md3"] .bnav .ico { width: 22px; height: 22px; }
}
@media (prefers-reduced-motion: no-preference) {

}

table.cmpt tr:first-child th { text-align: left; color: var(--accent); }
td.cz { cursor: pointer; }
td.cz .czb { display: inline-block; color: var(--muted); font-size: 12.5px; border: 1px dashed var(--line); border-radius: 8px; padding: 2px 10px; }
td.cz.open { background: var(--accent-soft); }
/* 名解闪卡 */
.fl-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.fl-bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin-bottom: 16px; }
.fl-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.fl-stage { display: flex; justify-content: center; padding: 6px 0 14px; touch-action: pan-y; }
.fl-card { position: relative; width: 100%; max-width: 620px; min-height: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 26px 28px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform .22s ease, opacity .22s ease; touch-action: pan-y; }
.fl-front { text-align: center; display: grid; gap: 14px; }
.fl-front[hidden], .fl-back[hidden], .czt[hidden], .czb[hidden] { display: none; }
.fl-term { font-family: var(--f-disp); font-size: 28px; font-weight: 700; line-height: 1.35; }
.fl-term.sm { font-size: 18px; margin-bottom: 10px; color: var(--accent); }
.fl-def { font-size: 15.5px; line-height: 1.75; max-height: 52vh; overflow: auto; }
.fl-def p { margin: 0 0 6px; }
.fl-stamp { position: absolute; top: 16px; font-weight: 800; font-size: 15px; padding: 4px 12px; border-radius: 10px; border: 2px solid; opacity: 0; transition: opacity .15s; pointer-events: none; }
.fl-stamp.l { left: 16px; color: var(--bad); transform: rotate(-8deg); }
.fl-stamp.r { right: 16px; color: var(--ok); transform: rotate(8deg); }
.fl-card.to-l .fl-stamp.l, .fl-card.to-r .fl-stamp.r { opacity: 1; }
.fl-card.out-r { transform: translateX(120%) rotate(14deg) !important; opacity: 0; }
.fl-card.out-l { transform: translateX(-120%) rotate(-14deg) !important; opacity: 0; }
.fl-card.out-d { transform: translateY(40px) !important; opacity: 0; }
.fl-btns { justify-content: center; gap: 10px; }
.fl-btns .btn { min-width: 6.5em; }
.fl-end { text-align: center; padding: 26px; }
.fl-end b.ok { color: var(--ok); } .fl-end b.mid { color: var(--mid); } .fl-end b.bad { color: var(--bad); }
@media (max-width: 520px) { .fl-term { font-size: 24px; } .fl-card { min-height: 260px; padding: 22px 18px; } table.cmpt th:first-child { width: 4.6em; } }

/* ===== 2.2 试验性功能 ===== */
/* 答题框架 */
.frms { display: grid; gap: 14px; }
.frm-n { font-size: 16px; }
.frm-s { margin: 10px 0 6px; padding-left: 1.5em; line-height: 1.75; }
.frm-s li { margin: 3px 0; }
.frm-tip { margin: 6px 0 0; }
.frm-ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.frm-p { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 12px; padding: 10px 14px; background: var(--accent-soft); }
.frm-p[hidden] { display: none; }
.frm-h { display: flex; gap: 8px; align-items: baseline; }
.frm-p .frm-s { margin: 6px 0 4px; }
/* 模拟卷诊断 */
.mdiag { margin-bottom: 18px; }
.md-sum { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 12px; }
.md-g { gap: 18px; }
.md-t { margin-bottom: 6px; }
.bar-row.wide { grid-template-columns: 7.5em 1fr 3.2em; margin: 5px 0; }
.bar-row.wide .bt i { background: var(--bad); }
.md-cl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
/* 考点趋势 */
.chip.tr { font-size: 11.5px; padding: 1px 8px; border-color: transparent; }
.chip.tr.hot { background: var(--hot-soft); color: var(--hot); }
.chip.tr.gap { background: var(--mid-soft); color: var(--mid); }
.chip.tr.new { background: var(--ok-soft); color: var(--ok); }
/* 睡前回顾 */
.card.night { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
.card.night .nt-i { font-size: 26px; line-height: 1; }
.card.night .nt-b { flex: 1; min-width: 0; }
.card.night.late { border: 1px solid var(--accent); }
@media (max-width: 520px) { .card.night { flex-wrap: wrap; } .card.night .btn { width: 100%; } }
/* 悬浮搜索 */
.gs-pill { position: fixed; top: 14px; transform: translateX(-50%); z-index: 45; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px 0 16px; border-radius: 21px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 14.5px; cursor: text; box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: left; }
.gs-pill span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gs-pill kbd { font: 12px/1 var(--f-body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface2); }
.gs-pill:hover { border-color: var(--accent); }
.gs-ic { width: 18px; height: 18px; flex: none; }
html.ios-app .gs-pill { top: 40px; }
[data-skin="book"] .gs-pill { top: 26px; }
[data-skin="glass"] .gs-pill { background: rgba(var(--pane), calc(var(--glass-a) + .2)); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%); backdrop-filter: blur(var(--glass-blur)) saturate(180%); border-color: rgba(255,255,255,.5); }
[data-skin="md3"] .gs-pill { border: 0; border-radius: 28px; height: 48px; background: var(--surface2); box-shadow: none; }
@media (min-width: 861px) {
  html.gs main { padding-top: 76px; }
  html.gs.ios-app main { padding-top: 100px; }
  html.gs[data-skin="book"] main { padding-top: 84px; }
}
@media (max-width: 860px) { .gs-pill { display: none; } }
/* 弹出题卡等浮层时，顶部搜索框在遮罩下面，不再和弹窗重叠 */
body:has(#modal > *) .gs-pill { visibility: hidden; }
.gs-mpill { display: none; }
@media (max-width: 860px) {
  .gs-mpill { display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); margin: 2px 12px 10px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 14.5px; text-align: left; cursor: text; }
  .gs-mpill span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-skin="glass"] .gs-mpill { background: rgba(var(--pane), calc(var(--glass-a) + .25)); border-color: rgba(255,255,255,.55); }
  [data-skin="md3"] .gs-mpill { border: 0; height: 48px; border-radius: 24px; background: var(--surface2); }
  [data-skin="book"] .gs-mpill { border-radius: 6px; }
}
.gs-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: var(--ink); cursor: pointer; margin-left: 4px; }
.gs-btn svg { width: 20px; height: 20px; }
.gs-ov { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
html.ios-app .gs-ov { padding-top: 40px; }
.gs-box { width: min(760px, 100%); max-height: min(78vh, 900px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden; animation: gsIn .18s ease; }
@keyframes gsIn { from { opacity: 0; transform: translateY(-8px) scale(.99); } to { opacity: 1; transform: none; } }
.gs-in { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.gs-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); padding: 6px 0; }
.gs-res { overflow: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
.gs-res h2 { font-size: 15px; margin: 14px 0 6px; }
.gs-hint { margin: 14px 0 4px; }
[data-skin="glass"] .gs-box { background: rgba(var(--pane), calc(var(--glass-a) + .3)); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); }

/* 2.2：带 hidden 属性的元素一律隐藏（之前 .row、.btn 的 display 规则会把它们重新显示出来，例如对答案前就出现的打分行） */
[hidden] { display: none !important; }
.gs-in input[type="search"] { background: transparent !important; border: 0 !important; box-shadow: none !important; border-radius: 0 !important; padding: 6px 0 !important; }

/* 2.2.3：更新日志入口与二级页面 */
.chlog-all { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 12px 4px 2px; border-top: 1px solid var(--line); color: var(--accent); text-decoration: none; font-weight: 600; }
.chlog-all span:first-child { flex: 1; }
.chlog-all .chev { font-size: 20px; line-height: 1; }
.sub-back { display: inline-block; margin: 0 0 6px; color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
